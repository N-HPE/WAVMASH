# WaveMash conda environment (Linux / macOS / WSL).
#
# Essentia has no Windows wheels, so this env is the supported way to get the
# high-accuracy backend. Inside it, desktop_app/analysis.py AUTOMATICALLY uses:
#   - Essentia KeyExtractor (EDMA profile) for key
#   - Essentia RhythmExtractor2013 (multifeature) for the beat grid
#   - Essentia BeatsLoudness (kick/bass band) for downbeat phase
# and falls back to librosa + AudioFlux only if Essentia is missing.
#
# Create & activate:
#   conda env create -f environment.yml
#   conda activate wavemash
# Then run the app the usual way, e.g.:
#   python -m desktop_app           # GUI (needs a display; WSLg works on Win11)
#   python verify_essentia.py       # headless backend check (see docker/)
name: wavemash
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - libsndfile
  - numpy
  - scipy
  - essentia            # conda-forge: Linux/macOS only
  - pip:
      - yt-dlp>=2024.12.0
      - ffmpeg-python
      - mutagen
      - librosa
      - soundfile
      - static_ffmpeg
      - audioflux
      - "PySide6>=6.7.0"
      # Spotify support (spotdl pulls an old fastapi, so install with --no-deps):
      #   pip install spotdl --no-deps
