# ============================================================================
# WaveMash Render Blueprint (Infrastructure as Code)
# GitHub main → autoDeploy backend. Frontend lives on Vercel.
# ============================================================================
services:
  - type: web
    name: wavmash-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WAVMASH_HOST
        value: "0.0.0.0"
      - key: WAVMASH_AUTO_SYNC_ON_START
        value: "false"
      - key: WAVMASH_EPHEMERAL
        value: "true"
      - key: CORS_ORIGINS
        value: "https://wavmash.vercel.app,http://localhost:3000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GETSONGBPM_API_KEY
        sync: false
