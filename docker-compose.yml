# WaveMash — Docker Compose
# Runs the FastAPI backend and Next.js frontend together.
#
# Usage:
#   docker compose up --build        # build & start both services
#   docker compose up -d             # detached mode
#   docker compose down              # stop & remove containers

services:
  # ── FastAPI backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: wavemash-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - WAVMASH_HOST=0.0.0.0
      - WAVMASH_PORT=8000
      - WAV_STORAGE_PATH=/app/data/wav
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - wav-data:/app/data/wav
      - ./archive.json:/app/archive.json
      - ./playlists.json:/app/playlists.json
      - ./track_index.db:/app/track_index.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wavemash-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wav-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WAV_STORAGE_PATH:-./data/wav}
